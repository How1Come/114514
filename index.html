<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>
    <style>
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -360px;
        width: 360px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 99998;
        padding: 12px 12px 20px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #cheatTabs { margin-bottom:10px; }
      #cheatTabs button {
        margin: 4px 4px 4px 0;
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #cheatPanel label { display:inline-block; width:140px; }
      #cheatPanel input { width:70px; margin-right:6px; }
      #cheatPanel .row { margin: 6px 0; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }

      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100000;
        cursor: pointer;
        user-select: none;
      }
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100000;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }
      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; }
    </style>
  </head>
  <body style="background-color: black">
    <!-- RPG Maker MV core -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button onclick="showCheatTab('money')">Money</button>
        <button onclick="showCheatTab('items')">Items</button>
        <button onclick="showCheatTab('actors')">Actors</button>
        <button onclick="showCheatTab('vars')">Vars</button>
        <button onclick="showCheatTab('time')">Time</button>
        <button onclick="showCheatTab('settings')">Settings</button>
      </div>
      <div id="cheatContent">Choose a tab…</div>
    </div>

    <!-- Virtual ESC -->
    <button id="escButton">ESC</button>

    <script>
      (function(){
        const fab=document.getElementById('cheatFab');
        const panel=document.getElementById('cheatPanel');
        const close=document.getElementById('cheatClose');
        fab.onclick=()=>{panel.classList.add('open');fab.style.display='none';};
        close.onclick=()=>{panel.classList.remove('open');fab.style.display='block';};
      })();

      function showCheatTab(tab){
        const box=document.getElementById('cheatContent');
        box.innerHTML='';
        try{
          if(tab==='money')return buildMoneyEditor(box);
          if(tab==='items')return buildItemEditor(box);
          if(tab==='actors')return buildActorEditor(box);
          if(tab==='vars')return buildVarEditor(box);
          if(tab==='time')return buildTimeEditor(box);
          if(tab==='settings')return buildSettingsEditor(box);
        }catch(e){box.textContent='Game not loaded yet.';}
      }

      function buildMoneyEditor(c){
        if(!$gameParty){c.textContent='Game not loaded yet.';return;}
        c.innerHTML=`<div class="row"><label>Money</label>
        <input type="number" id="cheat-money" value="${$gameParty.gold()}">
        <button onclick="setMoney()">Set</button></div>`;
      }
      function setMoney(){const v=parseInt(document.getElementById('cheat-money').value,10);if(!isNaN(v))$gameParty._gold=v;}

      function buildItemEditor(c){
        if(!$dataItems||!$gameParty){c.textContent='Game not loaded yet.';return;}
        $dataItems.forEach(it=>{
          if(it)c.innerHTML+=`<div class="row"><label>${it.name}</label>
          <input type="number" id="cheat-item-${it.id}" value="${$gameParty.numItems(it)}">
          <button onclick="setItem(${it.id})">Set</button></div>`;
        });
      }
      function setItem(id){
        const v=parseInt(document.getElementById('cheat-item-'+id).value,10);
        if(!isNaN(v)){$gameParty.gainItem($dataItems[id],v-$gameParty.numItems($dataItems[id]));}
      }

      function buildActorEditor(c){
        if(!$gameActors||!$gameParty){c.textContent='Game not loaded yet.';return;}
        $gameParty.members().forEach(a=>{
          const id=a.actorId();
          c.innerHTML+=`<div><b>${a.name()}</b><br>
          <label>HP:</label><input id="hp-${id}" value="${a.hp}" type="number">
          <button onclick="setActorHP(${id})">Set</button><br>
          <label>MP:</label><input id="mp-${id}" value="${a.mp}" type="number">
          <button onclick="setActorMP(${id})">Set</button><br>
          <label>LV:</label><input id="lv-${id}" value="${a.level}" type="number">
          <button onclick="setActorLV(${id})">Set</button><hr></div>`;
        });
      }
      function setActorHP(id){const a=$gameActors.actor(id);const v=parseInt(document.getElementById('hp-'+id).value,10);if(!isNaN(v))a.setHp(v);}
      function setActorMP(id){const a=$gameActors.actor(id);const v=parseInt(document.getElementById('mp-'+id).value,10);if(!isNaN(v))a.setMp(v);}
      function setActorLV(id){const a=$gameActors.actor(id);const v=parseInt(document.getElementById('lv-'+id).value,10);if(!isNaN(v))a.changeLevel(v,false);}

      function buildVarEditor(c){
        if(!$gameVariables){c.textContent='Game not loaded yet.';return;}
        c.innerHTML+='<h3>Variables</h3>';
        for(let i=1;i<=10;i++)c.innerHTML+=
        `<div class="row"><label>Var ${i}</label>
        <input id="var-${i}" value="${$gameVariables.value(i)}" type="number">
        <button onclick="setVar(${i})">Set</button></div>`;
        c.innerHTML+='<h3>Switches</h3>';
        for(let i=1;i<=10;i++)c.innerHTML+=
        `<div class="row"><label>Switch ${i}</label>
        <input id="sw-${i}" type="checkbox" ${$gameSwitches.value(i)?'checked':''} onchange="setSwitch(${i})"></div>`;
      }
      function setVar(i){const v=parseInt(document.getElementById('var-'+i).value,10);if(!isNaN(v))$gameVariables.setValue(i,v);}
      function setSwitch(i){$gameSwitches.setValue(i,document.getElementById('sw-'+i).checked);}

      function buildTimeEditor(c){
        const mins=Math.floor(Graphics.frameCount/60/60);
        c.innerHTML=`<div class="row"><label>Play Time (min)</label>
        <input id="cheat-time" value="${mins}" type="number">
        <button onclick="setTime()">Set</button></div>`;
      }
      function setTime(){
        const v=parseInt(document.getElementById('cheat-time').value,10);
        if(!isNaN(v))Graphics.frameCount=v*60*60;
      }

      let autosaveTimer=null, autosaveEnabled=false, autosaveSlot=1;
      function buildSettingsEditor(c){
        c.innerHTML=`<div class="row">
          <label>Auto-save interval (min)</label>
          <input id="autosaveInterval" type="number" value="5" min="1"></div>
          <div class="row"><label>Save slot</label>
          <input id="autosaveSlot" type="number" value="${autosaveSlot}" min="1"></div>
          <div class="row"><button onclick="toggleAutosave()">${autosaveEnabled?'Disable':'Enable'} Auto-save</button></div>
          <div class="row"><button onclick="saveNow()">Save Now</button>
          <button onclick="loadNow()">Load Now</button></div>
          <div class="row"><button onclick="forceOpenSave()">Force Save Menu</button>
          <button onclick="forceOpenLoad()">Force Load Menu</button></div>`;
      }
      function toggleAutosave(){
        const mins=parseInt(document.getElementById('autosaveInterval').value,10);
        autosaveSlot=parseInt(document.getElementById('autosaveSlot').value,10)||1;
        if(autosaveEnabled){
          clearInterval(autosaveTimer);autosaveEnabled=false;
          alert('Auto-save disabled');
        }else if(!isNaN(mins)&&mins>0){
          autosaveTimer=setInterval(()=>{DataManager.saveGame(autosaveSlot);console.log('Auto-saved slot',autosaveSlot);},mins*60000);
          autosaveEnabled=true;
          alert('Auto-save enabled (every '+mins+' min, slot '+autosaveSlot+')');
        }
        showCheatTab('settings');
      }
      function saveNow(){DataManager.saveGame(autosaveSlot).then(()=>alert('Saved slot '+autosaveSlot));}
      function loadNow(){DataManager.loadGame(autosaveSlot).then(()=>SceneManager.goto(Scene_Map));}
      function forceOpenSave(){SceneManager.push(Scene_Save);}
      function forceOpenLoad(){SceneManager.push(Scene_Load);}

      (function(){
        const btn=document.getElementById('escButton');
        btn.onclick=function(){
          if(SceneManager._scene instanceof Scene_Map && $gamePlayer.canMove()){
            SceneManager.push(Scene_Menu);
          }else{
            const ev=new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true});
            document.dispatchEvent(ev);
          }
        };
      })();
    </script>
  </body>
</html>
