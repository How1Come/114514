<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- modern PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- keep the old Apple ones for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>

    <style>
      /* ===== Cheat sidebar ===== */
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -380px;
        width: 380px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 99998;
        padding: 12px 12px 20px 12px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
        border-left: 1px solid rgba(255,255,255,.04);
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        display: inline-block;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #cheatTabs { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:8px; }
      #cheatTabs button {
        margin-right: 6px;
        margin-bottom: 6px;
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size:13px;
      }
      #cheatPanel label { display:inline-block; width:120px; vertical-align:middle; }
      #cheatPanel input[type="number"], #cheatPanel input[type="text"], #cheatPanel select { width:120px; margin-right:6px; padding:4px; box-sizing:border-box; vertical-align:middle; }
      #cheatPanel .row { margin: 8px 0; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }
      #cheatPanel .sub { color:#bbb; font-size:12px; margin-top:6px; }

      /* Floating open button */
      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100000;
        cursor: pointer;
        user-select: none;
      }

      /* Virtual ESC button (fixed at left corner) */
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100000;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        display: flex;
        align-items:center;
        justify-content:center;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }

      /* small helper */
      .btn { background:#2c2c2c;border:1px solid #555;padding:6px 10px;border-radius:6px;color:#fff;cursor:pointer }
      .btn.small { padding:4px 8px; font-size:13px }
      .muted { color:#9aa; font-size:13px }
      .status { font-size:13px; margin-top:8px; color:#9df; }
      .danger { color:#f88; }
      .ok { color:#8f8; }

      /* ensure overlays only handle their pointer area */
      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body style="background-color: black">
    <!-- RPG Maker MV core files -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab" title="Open cheats">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose" class="btn small">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button type="button" onclick="showCheatTab('money')">Money</button>
        <button type="button" onclick="showCheatTab('items')">Items</button>
        <button type="button" onclick="showCheatTab('actors')">Actors</button>
        <button type="button" onclick="showCheatTab('time')">Time</button>
        <button type="button" onclick="showCheatTab('vars')">Vars</button>
        <button type="button" onclick="showCheatTab('settings')">Settings</button>
      </div>
      <div id="cheatContent" class="muted">Choose a tab…</div>
    </div>

    <!-- Virtual ESC -->
    <button id="escButton" type="button" title="Open menu (ESC)">ESC</button>

    <script>
    (function(){
      /* ===== Utilities ===== */
      function el(t, html){ const d = document.createElement(t); if(html) d.innerHTML = html; return d; }
      function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

      const panel   = document.getElementById('cheatPanel');
      const fab     = document.getElementById('cheatFab');
      const close   = document.getElementById('cheatClose');
      const content = document.getElementById('cheatContent');

      function openPanel(){ panel.classList.add('open'); fab.style.display = 'none'; showCheatTab(panel.dataset.tab || 'money'); }
      function closePanel(){ panel.classList.remove('open'); fab.style.display = 'block'; }
      fab.addEventListener('click', openPanel);
      close.addEventListener('click', closePanel);

      /* ====== Tabs ====== */
      window.showCheatTab = function(tab){
        panel.dataset.tab = tab;
        content.innerHTML = '';
        if(tab==='money') return renderMoney(content);
        if(tab==='items') return renderItems(content);
        if(tab==='actors') return renderActors(content);
        if(tab==='time') return renderTime(content);
        if(tab==='vars') return renderVars(content);
        if(tab==='settings') return renderSettings(content);
      };

      /* ====== Money ====== */
      function renderMoney(c){
        if(!window.$gameParty){ c.textContent='Game not loaded'; return; }
        const gold=$gameParty.gold ? $gameParty.gold() : ($gameParty._gold||0);
        const row=el('div',`<label>Money</label><input type="number" id="cheat-money" value="${gold}"><button class="btn small">Set</button>`);
        row.querySelector('button').onclick=()=>{
          const v=parseInt(document.getElementById('cheat-money').value,10);
          if(!isNaN(v)) $gameParty._gold=v;
        };
        c.appendChild(row);
      }

      /* ====== Items ====== */
      function renderItems(c){
        if(!window.$dataItems||!$gameParty){c.textContent='Game not loaded';return;}
        $dataItems.forEach(item=>{
          if(!item) return;
          const row=el('div',`<label>${escapeHtml(item.name)}</label><input type="number" id="cheat-item-${item.id}" value="${$gameParty.numItems(item)}"><button class="btn small">Set</button>`);
          row.querySelector('button').onclick=()=>{
            const v=parseInt(document.getElementById('cheat-item-'+item.id).value,10);
            $gameParty.gainItem(item,v-$gameParty.numItems(item));
          };
          c.appendChild(row);
        });
      }

      /* ====== Actors ====== */
      function renderActors(c){
        if(!$gameActors||!$gameParty){c.textContent='Game not loaded';return;}
        $gameParty.members().forEach(a=>{
          const id=a.actorId();
          const block=el('div',`<b>${escapeHtml(a.name())}</b>
            <div><label>HP</label><input id="hp-${id}" value="${a.hp}"><button data="hp">Set</button></div>
            <div><label>MP</label><input id="mp-${id}" value="${a.mp}"><button data="mp">Set</button></div>
            <div><label>LV</label><input id="lv-${id}" value="${a.level}"><button data="lv">Set</button></div>`);
          block.querySelectorAll('button').forEach(btn=>{
            btn.className="btn small";
            btn.onclick=()=>{
              const v=parseInt(block.querySelector(`#${btn.getAttribute('data')}-${id}`).value,10);
              if(btn.getAttribute('data')==='hp') a.setHp(v);
              if(btn.getAttribute('data')==='mp') a.setMp(v);
              if(btn.getAttribute('data')==='lv') a.changeLevel(v,false);
            };
          });
          c.appendChild(block);
        });
      }

      /* ====== Time (Chronus-aware) ====== */
      const defaultTimeVarIds={weekday:135,month:137,day:139,hour:239,minute:240};
      function renderTime(c){
        if(!$gameVariables){c.textContent='Game not loaded';return;}
        Object.keys(defaultTimeVarIds).forEach(k=>{
          const vid=defaultTimeVarIds[k];
          const cur=$gameVariables.value(vid);
          const row=el('div',`
            <label>${k}</label>
            <input class="vid" data-k="${k}" value="${vid}">
            <input id="time-${k}" value="${cur}">
            <button class="btn small">Set</button>`);
          row.querySelector('button').onclick=()=>{
            const newId=parseInt(row.querySelector('.vid').value,10);
            const val=parseInt(document.getElementById('time-'+k).value,10);
            if(!isNaN(newId)&&!isNaN(val)){
              $gameVariables.setValue(newId,val);
              if(window.ChronusManager&&ChronusManager.setTime){
                ChronusManager.setTime(
                  $gameVariables.value(defaultTimeVarIds.hour),
                  $gameVariables.value(defaultTimeVarIds.minute),
                  $gameVariables.value(defaultTimeVarIds.day),
                  $gameVariables.value(defaultTimeVarIds.month),
                  $gameVariables.value(defaultTimeVarIds.weekday)
                );
              }
            }
          };
          c.appendChild(row);
        });
      }

      /* ====== Vars/Switches ====== */
      function renderVars(c){
        if(!$dataSystem||!$gameVariables){c.textContent='Game not loaded';return;}
        const sel=el('select'); $dataSystem.variables.forEach((v,i)=>{if(i) sel.appendChild(new Option(`${i} ${v||''}`,i));});
        const inp=el('input'); inp.type='number';
        const setBtn=el('button','Set'); setBtn.className="btn small";
        setBtn.onclick=()=>{$gameVariables.setValue(parseInt(sel.value,10),parseInt(inp.value,10));};
        c.appendChild(sel); c.appendChild(inp); c.appendChild(setBtn);
      }

      /* ====== Settings ====== */
      function renderSettings(c){
        c.textContent="(Auto-save etc here — unchanged)";
      }

      /* ====== ESC ====== */
      (function(){
        const btn=document.getElementById('escButton'); let lock=false;
        function press(){
          if(lock) return; lock=true; setTimeout(()=>lock=false,300);
          if(SceneManager&&SceneManager._scene instanceof Scene_Map) SceneManager.push(Scene_Menu);
          else {
            const ev=new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true});
            document.dispatchEvent(ev); window.dispatchEvent(ev);
          }
        }
        btn.addEventListener('click',press);
        btn.addEventListener('touchstart',press);
      })();
    })();
    </script>
  </body>
</html>
