<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- modern PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- keep the old Apple ones for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>
    <style>
      /* ===== Cheat sidebar ===== */
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -360px;        /* hidden */
        width: 360px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 99998;
        padding: 12px 12px 20px 12px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        display: inline-block;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #cheatTabs { margin-bottom:10px; }
      #cheatTabs button {
        margin-right: 6px;
        margin-bottom: 6px;
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #cheatPanel label { display:inline-block; width:150px; }
      #cheatPanel input { width:70px; margin-right:6px; }
      #cheatPanel .row { margin: 6px 0; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }

      /* Floating open button that’s visible when the panel is closed */
      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100000;
        cursor: pointer;
        user-select: none;
      }

      /* ===== Virtual ESC button (fixed at left corner) ===== */
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100000;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }

      /* Make sure overlays never block pointer events to the game except on their own surface */
      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; }
    </style>
  </head>
  <body style="background-color: black">
    <!-- RPG Maker MV core files -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab" title="Open cheats">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button type="button" onclick="showCheatTab('money')">Money</button>
        <button type="button" onclick="showCheatTab('items')">Items</button>
        <button type="button" onclick="showCheatTab('actors')">Actors</button>
        <button type="button" onclick="showCheatTab('vars')">Vars</button>
        <button type="button" onclick="showCheatTab('time')">Time</button>
        <button type="button" onclick="showCheatTab('settings')">Settings</button>
      </div>
      <div id="cheatContent">Choose a tab…</div>
    </div>

    <!-- Virtual ESC (opens menu reliably on mobile) -->
    <button id="escButton" type="button" title="Open menu (ESC)">ESC</button>

    <script>
      /* ========= Panel open/close ========= */
      (function(){
        const fab   = document.getElementById('cheatFab');
        const panel = document.getElementById('cheatPanel');
        const close = document.getElementById('cheatClose');
        function openPanel(){ panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); fab.style.display = 'none'; }
        function closePanel(){ panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); fab.style.display = 'block'; }
        fab.addEventListener('click', openPanel);
        close.addEventListener('click', closePanel);
      })();

      /* ========= Cheat tabs ========= */
      function showCheatTab(tab){
        const box = document.getElementById('cheatContent');
        box.innerHTML = '';
        try {
          if (tab === 'money') return buildMoneyEditor(box);
          if (tab === 'items') return buildItemEditor(box);
          if (tab === 'actors') return buildActorEditor(box);
          if (tab === 'vars') return buildVarEditor(box);
          if (tab === 'time') return buildTimeEditor(box);
          if (tab === 'settings') return buildSettingsEditor(box);
        } catch (e) {
          box.textContent = 'Game not fully loaded yet.';
        }
      }

      /* ========= Money ========= */
      function buildMoneyEditor(container){
        if (!window.$gameParty) return container.textContent='Game not loaded yet.';
        container.innerHTML =
          `<label>Money</label>
           <input type="number" id="cheat-money" value="${$gameParty.gold()}">
           <button onclick="setMoney()">Set</button>`;
      }
      function setMoney(){
        const val = parseInt(document.getElementById('cheat-money').value,10);
        if (!isNaN(val)) $gameParty._gold = val;
      }

      /* ========= Items ========= */
      function buildItemEditor(container){
        if (!window.$dataItems || !window.$gameParty) return container.textContent='Game not loaded yet.';
        $dataItems.forEach(item=>{
          if (item) container.innerHTML +=
            `<div class="row"><label>${item.name}</label>
             <input type="number" id="cheat-item-${item.id}" value="${$gameParty.numItems(item)}">
             <button onclick="setItem(${item.id})">Set</button></div>`;
        });
      }
      function setItem(id){
        const val = parseInt(document.getElementById('cheat-item-'+id).value,10);
        if (!isNaN(val)){ const item=$dataItems[id]; $gameParty.gainItem(item,val-$gameParty.numItems(item)); }
      }

      /* ========= Actors ========= */
      function buildActorEditor(container){
        if (!window.$gameActors || !$gameParty) return container.textContent='Game not loaded yet.';
        $gameParty.members().forEach(actor=>{
          container.innerHTML += `<div><b>${actor.name()}</b><br>
            <label>HP:</label><input id="hp-${actor.actorId()}" value="${actor.hp}">
            <button onclick="setActorHP(${actor.actorId()})">Set</button><br>
            <label>MP:</label><input id="mp-${actor.actorId()}" value="${actor.mp}">
            <button onclick="setActorMP(${actor.actorId()})">Set</button><br>
            <label>Level:</label><input id="lv-${actor.actorId()}" value="${actor.level}">
            <button onclick="setActorLV(${actor.actorId()})">Set</button><hr></div>`;
        });
      }
      function setActorHP(id){ $gameActors.actor(id).setHp(parseInt(document.getElementById('hp-'+id).value,10)); }
      function setActorMP(id){ $gameActors.actor(id).setMp(parseInt(document.getElementById('mp-'+id).value,10)); }
      function setActorLV(id){ $gameActors.actor(id).changeLevel(parseInt(document.getElementById('lv-'+id).value,10),false); }

      /* ========= Vars & Switches ========= */
      function buildVarEditor(container){
        if (!window.$gameVariables) return container.textContent='Game not loaded yet.';
        for (let i=1;i<=10;i++){
          container.innerHTML += `<div><label>Var ${i}</label>
            <input id="var-${i}" value="${$gameVariables.value(i)}">
            <button onclick="setVar(${i})">Set</button></div>`;
        }
        for (let i=1;i<=10;i++){
          container.innerHTML += `<div><label>Switch ${i}</label>
            <input type="checkbox" id="sw-${i}" ${$gameSwitches.value(i)?'checked':''}
            onchange="setSwitch(${i})"></div>`;
        }
      }
      function setVar(i){ $gameVariables.setValue(i,parseInt(document.getElementById('var-'+i).value,10)); }
      function setSwitch(i){ $gameSwitches.setValue(i,document.getElementById('sw-'+i).checked); }

      /* ========= Time ========= */
      function buildTimeEditor(container){
        if (!window.$gameVariables) return container.textContent='Game not loaded yet.';
        let found=false;
        $gameVariables._data.forEach((val,i)=>{
          if (i>0 && typeof val==='number' && val>0 && val<999999){
            found=true;
            container.innerHTML+=`<div><label>Var ${i} (time?)</label>
              <input id="time-${i}" value="${val}">
              <button onclick="setTime(${i})">Set</button></div>`;
          }
        });
        if(!found) container.textContent='No candidate time variables found.';
      }
      function setTime(i){ $gameVariables.setValue(i,parseInt(document.getElementById('time-'+i).value,10)); }

      /* ========= Settings ========= */
      let autosaveTimer=null;
      function buildSettingsEditor(container){
        container.innerHTML=`<div><label>Auto-save (minutes)</label>
          <input id="autosave-mins" value="5">
          <button onclick="enableAutosave()">Enable</button>
          <button onclick="disableAutosave()">Disable</button></div>
          <hr><button onclick="forceSave()">Force Save Menu</button>
          <button onclick="forceLoad()">Force Load Menu</button>`;
      }
      function enableAutosave(){
        const mins=parseInt(document.getElementById('autosave-mins').value,10);
        if(isNaN(mins)||mins<=0)return;
        if(autosaveTimer)clearInterval(autosaveTimer);
        autosaveTimer=setInterval(()=>{try{$gameSystem.onBeforeSave();DataManager.saveGame(1);}catch(e){}},mins*60000);
        alert('Auto-save enabled every '+mins+' minutes');
      }
      function disableAutosave(){ if(autosaveTimer)clearInterval(autosaveTimer); autosaveTimer=null; alert('Auto-save disabled'); }
      function forceSave(){ SceneManager.push(Scene_Save); }
      function forceLoad(){ SceneManager.push(Scene_Load); }

      /* ========= Virtual ESC ========= */
      (function(){
        const btn=document.getElementById('escButton');
        btn.onclick=()=>{ if(SceneManager._scene instanceof Scene_Map){ SceneManager.push(Scene_Menu); } };
      })();
    </script>
  </body>
</html>
