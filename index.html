<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>
    <style>
      #cheatPanel{position:fixed;top:0;right:-380px;width:380px;height:100%;background:rgba(17,17,17,.98);color:#fff;overflow-y:auto;z-index:99998;padding:12px;box-sizing:border-box;transition:right .28s;font-family:Arial, sans-serif;font-size:14px;-webkit-overflow-scrolling:touch;border-left:1px solid rgba(255,255,255,.04)}
      #cheatPanel.open{right:0}
      #cheatPanel h2{margin:8px 0 10px;font-size:16px;border-bottom:1px solid #444;padding-bottom:6px}
      #cheatClose{position:sticky;top:0;background:#333;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 10px;margin-bottom:8px;cursor:pointer}
      #cheatTabs{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px}
      #cheatTabs button{background:#2a2a2a;border:1px solid #555;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
      #cheatPanel label{display:inline-block;width:120px;vertical-align:middle}
      #cheatPanel input[type="number"],#cheatPanel input[type="text"],#cheatPanel select{width:120px;margin-right:6px;padding:4px;box-sizing:border-box;vertical-align:middle}
      #cheatPanel .row{margin:8px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
      #cheatPanel hr{border:0;border-top:1px solid #333;margin:8px 0}
      #cheatPanel .sub{color:#bbb;font-size:12px;margin-top:6px}
      #cheatFab{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;line-height:44px;text-align:center;border-radius:22px;background:rgba(34,34,34,.95);color:#fff;border:1px solid #555;box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:100000;cursor:pointer;user-select:none}
      #escButton{position:fixed;left:12px;bottom:12px;width:64px;height:64px;border-radius:50%;background:rgba(68,68,68,0.95);color:#fff;border:1px solid #555;font-size:16px;font-weight:bold;z-index:100000;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
      .btn{background:#2c2c2c;border:1px solid #555;padding:6px 10px;border-radius:6px;color:#fff;cursor:pointer}
      .btn.small{padding:4px 8px;font-size:13px}
      .muted{color:#9aa;font-size:13px}
      .status{font-size:13px;margin-top:8px;color:#9df}
      canvas,body{-webkit-user-select:none;user-select:none;touch-action:manipulation}
    </style>
  </head>
  <body style="background-color:black">
    <!-- RPG Maker MV core files -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <div id="cheatFab" title="Open cheats">≡</div>

    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose" class="btn small">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs" aria-hidden="false">
        <button type="button" onclick="showCheatTab('money')">Money</button>
        <button type="button" onclick="showCheatTab('items')">Items</button>
        <button type="button" onclick="showCheatTab('actors')">Actors</button>
        <button type="button" onclick="showCheatTab('time')">Time</button>
        <button type="button" onclick="showCheatTab('vars')">Vars</button>
        <button type="button" onclick="showCheatTab('settings')">Settings</button>
      </div>
      <div id="cheatContent" class="muted">Choose a tab…</div>
    </div>

    <button id="escButton" type="button" title="Open menu (ESC)">ESC</button>

    <script>
    (function(){
      const fab = document.getElementById('cheatFab');
      const panel = document.getElementById('cheatPanel');
      const close = document.getElementById('cheatClose');
      const content = document.getElementById('cheatContent');

      function openPanel(){ panel.classList.add('open'); panel.setAttribute('aria-hidden','false'); fab.style.display='none'; const t = panel.dataset.tab||'money'; showCheatTab(t); }
      function closePanel(){ panel.classList.remove('open'); panel.setAttribute('aria-hidden','true'); fab.style.display='block'; }
      fab.addEventListener('click', openPanel);
      close.addEventListener('click', closePanel);
      window.__cheatPanelOpen = openPanel;
      window.__cheatPanelClose = closePanel;

      function el(t, html){ const e = document.createElement(t); if(html) e.innerHTML = html; return e; }
      function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

      // autosave state (OFF by default)
      let autosaveTimer = null;
      let autosaveEnabled = false;
      let autosaveIntervalMs = 5*60*1000;
      let autosaveSlot = 1;

      function enableAutosave(enabled){
        autosaveEnabled = !!enabled;
        if(autosaveTimer){ clearInterval(autosaveTimer); autosaveTimer = null; }
        if(autosaveEnabled){
          autosaveTimer = setInterval(()=>{ try{ doSave(autosaveSlot, true); }catch(e){ console.warn('autosave failed',e); } }, autosaveIntervalMs);
        }
        renderSettingsStatus();
      }
      function renderSettingsStatus(){
        const s = document.getElementById('settingsStatus'); if(!s) return;
        s.textContent = autosaveEnabled ? `Auto-save: every ${autosaveIntervalMs/60000} min (slot ${autosaveSlot})` : 'Auto-save: OFF';
      }

      async function doSave(slot, silent){
        if(!window.DataManager || typeof DataManager.saveGame!=='function'){ alert('Save not available'); return;}
        slot = Number(slot)||1;
        try{
          const ok = await DataManager.saveGame(slot);
          if(!silent) alert(ok?`Saved slot ${slot}`:'Save failed');
        }catch(e){ console.error('Save error',e); alert('Save failed: '+(e&&e.message?e.message:e)); }
      }
      async function doLoad(slot){
        if(!window.DataManager || typeof DataManager.loadGame!=='function'){ alert('Load not available'); return;}
        slot = Number(slot)||1;
        try{
          const ok = await DataManager.loadGame(slot);
          if(ok){
            if(window.SceneManager && typeof SceneManager.reload==='function') SceneManager.reload();
            else location.reload();
          } else alert('Load failed (no saved data).');
        }catch(e){ console.error('Load error',e); alert('Load failed: '+(e&&e.message?e.message:e)); }
      }

      window.showCheatTab = function(tab){
        panel.dataset.tab = tab;
        content.innerHTML = '';
        try{
          if(tab==='money') return renderMoneyTab(content);
          if(tab==='items') return renderItemsTab(content);
          if(tab==='actors') return renderActorsTab(content);
          if(tab==='time') return renderTimeTab(content);
          if(tab==='vars') return renderVarsTab(content);
          if(tab==='settings') return renderSettingsTab(content);
        }catch(e){ content.textContent = 'Error: '+e.message; console.error(e); }
      };

      // Money
      function renderMoneyTab(container){
        const w = el('div');
        if(!window.$gameParty){ w.textContent='Game not loaded yet.'; container.appendChild(w); return; }
        const gold = (typeof $gameParty.gold==='function')?$gameParty.gold():($gameParty._gold||0);
        const row = el('div', `<label>Money</label><input type="number" id="cheat-money" value="${gold}" min="0"><button class="btn small" id="btn-set-money">Set</button><button class="btn small" id="btn-add-money">+1000</button>`);
        row.className='row'; w.appendChild(row); container.appendChild(w);
        w.querySelector('#btn-set-money').addEventListener('click', ()=>{
          const v = parseInt(document.getElementById('cheat-money').value,10);
          if(isNaN(v)||!window.$gameParty) return;
          if(typeof $gameParty._gold!=='undefined') $gameParty._gold = v;
          if(typeof $gameParty.gainGold==='function'){
            const cur = (typeof $gameParty.gold==='function')?$gameParty.gold():($gameParty._gold||0);
            $gameParty.gainGold(v-cur);
          }
          alert('Money set to '+v);
        });
        w.querySelector('#btn-add-money').addEventListener('click', ()=>{
          if(!window.$gameParty) return;
          if(typeof $gameParty.gainGold==='function') $gameParty.gainGold(1000);
          else if(typeof $gameParty._gold!=='undefined') $gameParty._gold = ($gameParty._gold||0)+1000;
          const newv = (typeof $gameParty.gold==='function')?$gameParty.gold():($gameParty._gold||0);
          document.getElementById('cheat-money').value = newv;
          alert('Added 1000. Now '+newv);
        });
      }

      // Items
      function renderItemsTab(container){
        const w = el('div');
        if(!window.$dataItems || !window.$gameParty){ w.textContent='Game not loaded yet.'; container.appendChild(w); return; }
        $dataItems.forEach(item=>{ if(!item) return; const id=item.id; const count = $gameParty.numItems? $gameParty.numItems(item):0; const row = el('div'); row.className='row'; row.innerHTML = `<label style="width:160px">${escapeHtml(item.name||('Item '+id))}</label><input type="number" id="cheat-item-${id}" value="${count}" min="0"><button class="btn small" data-id="${id}">Set</button>`; w.appendChild(row); });
        container.appendChild(w);
        w.addEventListener('click', ev=>{
          const b = ev.target.closest('button[data-id]'); if(!b) return;
          const id = Number(b.dataset.id); const input = document.getElementById('cheat-item-'+id); const v = parseInt(input.value,10); if(isNaN(v)) return;
          const item = $dataItems[id]; const cur = $gameParty.numItems(item); $gameParty.gainItem(item, v-cur); alert('Item '+(item.name||id)+' set to '+v);
        });
      }

      // Actors
      function renderActorsTab(container){
        const w = el('div');
        if(!window.$gameActors || !window.$gameParty){ w.textContent='Game not loaded yet.'; container.appendChild(w); return; }
        $gameParty.members().forEach(actor=>{ const id = actor.actorId(); const block = el('div'); block.style.borderTop='1px solid rgba(255,255,255,.04)'; block.style.paddingTop='8px'; block.innerHTML = `<div style="font-weight:700">${escapeHtml(actor.name())}</div><div class="row"><label>HP</label><input type="number" id="hp-${id}" value="${actor.hp}" min="0"><button class="btn small" data-set-hp="${id}">Set</button></div><div class="row"><label>MP</label><input type="number" id="mp-${id}" value="${actor.mp}" min="0"><button class="btn small" data-set-mp="${id}">Set</button></div><div class="row"><label>Level</label><input type="number" id="lv-${id}" value="${actor.level}" min="1"><button class="btn small" data-set-lv="${id}">Set</button></div>`; w.appendChild(block); });
        container.appendChild(w);
        w.addEventListener('click', ev=>{
          const hpBtn = ev.target.closest('button[data-set-hp]'); if(hpBtn){ const id=Number(hpBtn.getAttribute('data-set-hp')); const val=parseInt(document.getElementById('hp-'+id).value,10); if(!isNaN(val)){ const a=$gameActors.actor(id); if(a) a.setHp(val); alert('HP set'); } return; }
          const mpBtn = ev.target.closest('button[data-set-mp]'); if(mpBtn){ const id=Number(mpBtn.getAttribute('data-set-mp')); const val=parseInt(document.getElementById('mp-'+id).value,10); if(!isNaN(val)){ const a=$gameActors.actor(id); if(a) a.setMp(val); alert('MP set'); } return; }
          const lvBtn = ev.target.closest('button[data-set-lv]'); if(lvBtn){ const id=Number(lvBtn.getAttribute('data-set-lv')); const val=parseInt(document.getElementById('lv-'+id).value,10); if(!isNaN(val)){ const a=$gameActors.actor(id); if(a) a.changeLevel(val,false); alert('Level set'); } return; }
        });
      }

      // Time tab - use Chronus API directly
      const defaultTimeVarIds = { weekday:135, month:137, day:139, hour:239, minute:240 };
      function renderTimeTab(container){
        const w = el('div');
        if(!window.$gameVariables || !window.$gameSystem || !window.$gameMap){ w.textContent='Game not ready.'; container.appendChild(w); return; }
        w.appendChild(el('div','<div class="sub">This tab uses Chronus API to apply time/date immediately. If values look wrong, adjust Year/Month/Day/Hour/Minute then press Set.</div>'));
        // Year, Month, Day, Hour, Minute controls
        const fields = ['year','month','day','hour','minute'];
        const row = el('div'); row.className='row';
        row.innerHTML = `<label style="width:90px">Year</label><input type="number" id="time-year" value="${$gameSystem && $gameSystem.chronus? $gameSystem.chronus().getYear() : 1}" min="1" style="width:90px"><label style="width:60px">Month</label><input type="number" id="time-month" value="${$gameSystem && $gameSystem.chronus? $gameSystem.chronus().getMonth() : 1}" min="1" style="width:70px">`;
        w.appendChild(row);
        const row2 = el('div'); row2.className='row';
        row2.innerHTML = `<label style="width:90px">Day</label><input type="number" id="time-day" value="${$gameSystem && $gameSystem.chronus? $gameSystem.chronus().getDay() : 1}" min="1" style="width:90px"><label style="width:60px">Hour</label><input type="number" id="time-hour" value="${$gameSystem && $gameSystem.chronus? $gameSystem.chronus().getHour() : 0}" min="0" max="23" style="width:70px"><label style="width:60px">Minute</label><input type="number" id="time-minute" value="${$gameSystem && $gameSystem.chronus? $gameSystem.chronus().getMinute() : 0}" min="0" max="59" style="width:70px">`;
        w.appendChild(row2);
        const btnRow = el('div'); btnRow.className='row';
        btnRow.innerHTML = `<button class="btn small" id="time-apply">Set Date & Time (Chronus)</button><button class="btn small" id="time-apply-vars">Also set Vars</button><button class="btn small" id="time-refresh">Refresh</button><div class="sub">If you want weekday changed, use Year/Month/Day + Set.</div>`;
        w.appendChild(btnRow);
        container.appendChild(w);

        function refreshFields(){
          if(!$gameSystem||!$gameSystem.chronus) return;
          const c = $gameSystem.chronus();
          document.getElementById('time-year').value = c.getYear();
          document.getElementById('time-month').value = c.getMonth();
          document.getElementById('time-day').value = c.getDay();
          document.getElementById('time-hour').value = c.getHour();
          document.getElementById('time-minute').value = c.getMinute();
        }
        w.querySelector('#time-refresh').addEventListener('click', refreshFields);

        w.querySelector('#time-apply').addEventListener('click', ()=>{
          if(!window.$gameSystem || !window.$gameSystem.chronus){ alert('Chronus not available'); return; }
          const y = parseInt(document.getElementById('time-year').value,10);
          const m = parseInt(document.getElementById('time-month').value,10);
          const d = parseInt(document.getElementById('time-day').value,10);
          const h = parseInt(document.getElementById('time-hour').value,10);
          const mi = parseInt(document.getElementById('time-minute').value,10);
          if(isNaN(y)||isNaN(m)||isNaN(d)||isNaN(h)||isNaN(mi)){ alert('Invalid values'); return; }
          try{
            $gameSystem.chronus().setDay(y,m,d);
            $gameSystem.chronus().setTime(h,mi);
            alert('Chronus date/time set.');
            refreshFields();
          }catch(e){ console.error(e); alert('Failed to set Chronus time: '+e.message); }
        });

        w.querySelector('#time-apply-vars').addEventListener('click', ()=>{
          // set both Chronus and the variables (common Chronus vars may be separate)
          if(!window.$gameSystem || !window.$gameSystem.chronus){ alert('Chronus not available'); return; }
          const y = parseInt(document.getElementById('time-year').value,10);
          const m = parseInt(document.getElementById('time-month').value,10);
          const d = parseInt(document.getElementById('time-day').value,10);
          const h = parseInt(document.getElementById('time-hour').value,10);
          const mi = parseInt(document.getElementById('time-minute').value,10);
          if(isNaN(y)||isNaN(m)||isNaN(d)||isNaN(h)||isNaN(mi)){ alert('Invalid values'); return; }
          try{
            $gameSystem.chronus().setDay(y,m,d);
            $gameSystem.chronus().setTime(h,mi);
            // also write to typical Chronus variables if present in plugin params (ids may be different in your project)
            // we try the IDs you mentioned earlier and also plugin params
            const tryVars = { weekday:135, month:137, day:139, hour:239, minute:240 };
            tryVars.year = (function(){ try{ const idx = Number(PluginManager.parameters('Chronus')['年のゲーム変数']||0); return idx||0;}catch(e){return 0;} })();
            // set by best-effort
            if(typeof $gameVariables !== 'undefined'){
              if(tryVars.weekday) $gameVariables.setValue(tryVars.weekday, $gameSystem.chronus().getWeekIndex());
              if(tryVars.month) $gameVariables.setValue(tryVars.month, $gameSystem.chronus().getMonth());
              if(tryVars.day) $gameVariables.setValue(tryVars.day, $gameSystem.chronus().getDay());
              if(tryVars.hour) $gameVariables.setValue(tryVars.hour, $gameSystem.chronus().getHour());
              if(tryVars.minute) $gameVariables.setValue(tryVars.minute, $gameSystem.chronus().getMinute());
              if(tryVars.year) $gameVariables.setValue(tryVars.year, $gameSystem.chronus().getYear());
            }
            alert('Chronus and common vars set.');
            refreshFields();
          }catch(e){ console.error(e); alert('Failed: '+e.message); }
        });

        refreshFields();
      }

      // Vars tab
      function renderVarsTab(container){
        const w = el('div');
        if(!window.$dataSystem || !window.$gameVariables || !window.$gameSwitches){ w.textContent='Game not loaded yet.'; container.appendChild(w); return; }

        const varRow = el('div'); varRow.className='row'; varRow.innerHTML = `<label>Variable</label><select id="cheat-var-select" style="width:220px"></select><button class="btn small" id="cheat-var-refresh">Refresh</button>`; w.appendChild(varRow);
        const varEdit = el('div'); varEdit.className='row'; varEdit.innerHTML = `<label>Value</label><input type="number" id="cheat-var-value" value="0"><button class="btn small" id="cheat-var-set">Set</button><button class="btn small" id="cheat-var-add">+1</button>`; w.appendChild(varEdit);

        const swRow = el('div'); swRow.className='row'; swRow.innerHTML = `<label>Switch</label><select id="cheat-sw-select" style="width:220px"></select><button class="btn small" id="cheat-sw-refresh">Refresh</button>`; w.appendChild(swRow);
        const swEdit = el('div'); swEdit.className='row'; swEdit.innerHTML = `<label>Value</label><select id="cheat-sw-value"><option value="1">ON</option><option value="0">OFF</option></select><button class="btn small" id="cheat-sw-set">Set</button>`; w.appendChild(swEdit);

        function populateVarsAndSwitches(){
          const varSelect = document.getElementById('cheat-var-select'); varSelect.innerHTML='';
          const vars = $dataSystem && $dataSystem.variables ? $dataSystem.variables : [];
          for(let i=1;i<vars.length;i++){ const name = vars[i] && vars[i].length ? vars[i] : `Var ${i}`; const opt = document.createElement('option'); opt.value=i; opt.textContent=`${i} — ${name}`; varSelect.appendChild(opt); }
          const swSelect = document.getElementById('cheat-sw-select'); swSelect.innerHTML='';
          const sws = $dataSystem && $dataSystem.switches ? $dataSystem.switches : [];
          for(let i=1;i<sws.length;i++){ const name = sws[i] && sws[i].length ? sws[i] : `Switch ${i}`; const opt = document.createElement('option'); opt.value=i; opt.textContent=`${i} — ${name}`; swSelect.appendChild(opt); }
          updateVarPreview(); updateSwPreview();
        }
        function updateVarPreview(){ const sel=document.getElementById('cheat-var-select'); const id=Number(sel.value)||0; const cur=$gameVariables.value(id); document.getElementById('cheat-var-value').value=(typeof cur!=='undefined'?cur:''); }
        function updateSwPreview(){ const sel=document.getElementById('cheat-sw-select'); const id=Number(sel.value)||0; const cur=$gameSwitches.value(id)?1:0; document.getElementById('cheat-sw-value').value=cur; }

        w.querySelector('#cheat-var-refresh').addEventListener('click', populateVarsAndSwitches);
        w.querySelector('#cheat-var-set').addEventListener('click', ()=>{ const id=Number(document.getElementById('cheat-var-select').value); const v=parseInt(document.getElementById('cheat-var-value').value,10); if(!isNaN(id)&&!isNaN(v)){ $gameVariables.setValue(id,v); alert(`Var ${id} set to ${v}`); }});
        w.querySelector('#cheat-var-add').addEventListener('click', ()=>{ const id=Number(document.getElementById('cheat-var-select').value); const cur=Number($gameVariables.value(id)||0); $gameVariables.setValue(id,cur+1); updateVarPreview(); });

        w.querySelector('#cheat-sw-refresh').addEventListener('click', populateVarsAndSwitches);
        w.querySelector('#cheat-sw-set').addEventListener('click', ()=>{ const id=Number(document.getElementById('cheat-sw-select').value); const v=Number(document.getElementById('cheat-sw-value').value)===1; if(!isNaN(id)){ $gameSwitches.setValue(id,v); alert(`Switch ${id} set to ${v?'ON':'OFF'}`); }});
        w.querySelector('#cheat-var-select').addEventListener('change', updateVarPreview);
        w.querySelector('#cheat-sw-select').addEventListener('change', updateSwPreview);

        container.appendChild(w);
        populateVarsAndSwitches();
      }

      // Settings tab
      function renderSettingsTab(container){
        const w = el('div');
        w.innerHTML = `<div class="row"><label>Auto-save</label><select id="autosave-interval" style="width:120px"><option value="300000">5 min</option><option value="600000">10 min</option><option value="900000">15 min</option><option value="1200000">20 min</option><option value="1800000">30 min</option></select><label style="width:70px">Slot</label><select id="autosave-slot" style="width:80px"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select><button class="btn small" id="autosave-toggle">Enable</button></div><div class="row"><button class="btn small" id="save-now">Save Now</button><button class="btn small" id="load-now">Load Now</button><select id="manual-slot" style="width:90px"><option value="1">slot 1</option><option value="2">slot 2</option><option value="3">slot 3</option><option value="4">slot 4</option><option value="5">slot 5</option><option value="6">slot 6</option></select></div><div class="row"><span id="settingsStatus" class="status">Auto-save: OFF</span></div><div class="row"><button class="btn small" id="force-open-save-menu">Force open Save menu</button><button class="btn small" id="force-open-load-menu">Force open Load menu</button></div><div class="sub">Auto-save is OFF by default (won't persist across reloads).</div>`;
        container.appendChild(w);

        const intSel = document.getElementById('autosave-interval');
        const slotSel = document.getElementById('autosave-slot');
        const toggleBtn = document.getElementById('autosave-toggle');
        const manualSlot = document.getElementById('manual-slot');
        const saveNowBtn = document.getElementById('save-now');
        const loadNowBtn = document.getElementById('load-now');

        intSel.value = String(autosaveIntervalMs);
        slotSel.value = String(autosaveSlot);
        renderSettingsStatus();

        intSel.addEventListener('change', ()=>{ autosaveIntervalMs = Number(intSel.value); if(autosaveEnabled) enableAutosave(true); renderSettingsStatus(); });
        slotSel.addEventListener('change', ()=>{ autosaveSlot = Number(slotSel.value); renderSettingsStatus(); });
        toggleBtn.addEventListener('click', ()=>{ enableAutosave(!autosaveEnabled); toggleBtn.textContent = autosaveEnabled ? 'Disable' : 'Enable'; });

        saveNowBtn.addEventListener('click', ()=>{ const s = Number(manualSlot.value) || 1; doSave(s,false); });
        loadNowBtn.addEventListener('click', ()=>{ const s = Number(manualSlot.value) || 1; if(confirm('Load slot '+s+'? Current progress will be replaced.')) doLoad(s); });

        document.getElementById('force-open-save-menu').addEventListener('click', ()=>{ try{ if(window.SceneManager) SceneManager.push(Scene_Save); else alert('Scene_Save unavailable'); }catch(e){ alert('Cannot open save menu: '+e.message); } });
        document.getElementById('force-open-load-menu').addEventListener('click', ()=>{ try{ if(window.SceneManager) SceneManager.push(Scene_Load); else alert('Scene_Load unavailable'); }catch(e){ alert('Cannot open load menu: '+e.message); } });

        renderSettingsStatus();
      }

      // ESC button (debounced)
      (function(){
        const btn = document.getElementById('escButton'); let disabled=false;
        function openMenuDirect(){
          try{
            if(window.SceneManager && SceneManager._scene){
              const sc = SceneManager._scene;
              if(window.Scene_Map && sc instanceof Scene_Map){
                if(window.$gamePlayer && $gamePlayer.canMove && $gamePlayer.canMove()){
                  if(window.SoundManager && SoundManager.playOk) SoundManager.playOk();
                  if(window.Window_MenuCommand && Window_MenuCommand.initCommandPosition) Window_MenuCommand.initCommandPosition();
                  SceneManager.push(Scene_Menu);
                  return true;
                }
              }
              if(SceneManager._stack && SceneManager._stack.length>1){
                if(typeof SceneManager.pop==='function') SceneManager.pop();
                else if(typeof SceneManager.goto==='function') SceneManager.goto(Scene_Map);
                return true;
              }
            }
          }catch(e){}
          return false;
        }
        function onEscPress(e){
          if(e && e.preventDefault) e.preventDefault();
          if(disabled) return;
          disabled = true;
          setTimeout(()=> disabled = false, 450);
          if(!openMenuDirect()){
            try{
              const ev = new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true,cancelable:true});
              Object.defineProperty(ev,'keyCode',{get:()=>27}); Object.defineProperty(ev,'which',{get:()=>27});
              document.dispatchEvent(ev); window.dispatchEvent(ev);
              setTimeout(()=>{ const ev2 = new KeyboardEvent('keyup',{key:'Escape',code:'Escape',bubbles:true,cancelable:true}); Object.defineProperty(ev2,'keyCode',{get:()=>27}); Object.defineProperty(ev2,'which',{get:()=>27}); document.dispatchEvent(ev2); window.dispatchEvent(ev2); },16);
            }catch(_){}
          }
        }
        btn.addEventListener('click', onEscPress, {passive:false});
        btn.addEventListener('touchstart', onEscPress, {passive:false});
      })();

      // expose for console
      window.__doSave = doSave;
      window.__doLoad = doLoad;

      // autosave OFF initially
      enableAutosave(false);

      // default tab
      window.__renderCheat = function(tab){ showCheatTab(tab||'money'); };

    })();
    </script>
  </body>
</html>
