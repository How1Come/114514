<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- modern PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- keep the old Apple ones for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>
    <style>
      /* ===== Cheat sidebar ===== */
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -360px;        /* hidden */
        width: 360px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 99998;
        padding: 12px 12px 20px 12px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        display: inline-block;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #cheatTabs { margin-bottom:10px; }
      #cheatTabs button {
        margin-right: 6px;
        margin-bottom: 6px;
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #cheatPanel label { display:inline-block; width:150px; }
      #cheatPanel input, #cheatPanel select { width:120px; margin-right:6px; }
      #cheatPanel .row { margin: 6px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }

      /* Floating open button that’s visible when the panel is closed */
      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100000;
        cursor: pointer;
        user-select: none;
      }

      /* ===== Virtual ESC button (fixed at left corner) ===== */
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100000;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }

      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; }
      .small { font-size: 12px; color: #cfcfcf; }
    </style>
  </head>
  <body style="background-color: black">
    <!-- RPG Maker MV core files -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab" title="Open cheats">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button type="button" onclick="showCheatTab('money')">Money</button>
        <button type="button" onclick="showCheatTab('items')">Items</button>
        <button type="button" onclick="showCheatTab('actors')">Actors</button>
        <button type="button" onclick="showCheatTab('vars')">Vars</button>
        <button type="button" onclick="showCheatTab('time')">Time</button>
        <button type="button" onclick="showCheatTab('settings')">Settings</button>
      </div>
      <div id="cheatContent">Choose a tab…</div>
    </div>

    <!-- Virtual ESC -->
    <button id="escButton" type="button" title="Back / Cancel (ESC)">ESC</button>

    <script>
      /* ========= Panel open/close ========= */
      (function(){
        const fab   = document.getElementById('cheatFab');
        const panel = document.getElementById('cheatPanel');
        const close = document.getElementById('cheatClose');
        function openPanel(){
          panel.classList.add('open');
          panel.setAttribute('aria-hidden','false');
          fab.style.display = 'none';
        }
        function closePanel(){
          panel.classList.remove('open');
          panel.setAttribute('aria-hidden','true');
          fab.style.display = 'block';
        }
        fab.addEventListener('click', openPanel);
        close.addEventListener('click', closePanel);
        // expose small helpers if needed
        window.__cheatPanelOpen = openPanel;
        window.__cheatPanelClose = closePanel;
      })();

      /* ========= Cheat tabs ========= */
      function showCheatTab(tab){
        const box = document.getElementById('cheatContent');
        box.innerHTML = '';
        try {
          if (tab === 'money')    return buildMoneyEditor(box);
          if (tab === 'items')    return buildItemEditor(box);
          if (tab === 'actors')   return buildActorEditor(box);
          if (tab === 'vars')     return buildVarEditor(box);
          if (tab === 'time')     return buildTimeEditor(box);
          if (tab === 'settings') return buildSettingsEditor(box);
        } catch (e) {
          box.textContent = 'Game not fully loaded yet.';
          console.warn(e);
        }
      }

      /* ========= Money ========= */
      function buildMoneyEditor(container){
        if (!window.$gameParty) { container.textContent='Game not loaded yet.'; return; }
        const gold = ($gameParty.gold ? $gameParty.gold() : ($gameParty._gold || 0));
        const row = document.createElement('div'); row.className='row';
        row.innerHTML = `<label>Money</label>
          <input type="number" id="cheat-money" value="${gold}" min="0">
          <button onclick="setMoney()">Set</button>`;
        container.appendChild(row);
        container.appendChild(Object.assign(document.createElement('div'),{className:'small',textContent:'If money does not change, the game may use custom property—use the console to find it.'}));
      }
      function setMoney(){
        const input=document.getElementById('cheat-money');
        if (!input) return;
        const val=parseInt(input.value,10);
        if (!isNaN(val) && window.$gameParty) {
          // Primary: set via gold() if available
          if (typeof $gameParty.gainGold === 'function') {
            // set difference
            const cur = $gameParty.gold ? $gameParty.gold() : ($gameParty._gold||0);
            $gameParty.gainGold(val - cur);
          } else {
            // fallback: write internal property (plugins vary)
            $gameParty._gold = val;
          }
        }
      }

      /* ========= Items ========= */
      function buildItemEditor(container){
        if (!window.$dataItems || !window.$gameParty) { container.textContent='Game not loaded yet.'; return; }
        // list items (only defined ones)
        $dataItems.forEach(item=>{
          if (item) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML =
              `<label style="width:180px">${item.name}</label>
               <input type="number" id="cheat-item-${item.id}" value="${$gameParty.numItems(item)}" min="0">
               <button onclick="setItem(${item.id})">Set</button>`;
            container.appendChild(row);
          }
        });
      }
      function setItem(id){
        const input = document.getElementById('cheat-item-'+id);
        if (!input) return;
        const val = parseInt(input.value, 10);
        if (isNaN(val)) return;
        const item = $dataItems[id];
        const cur = $gameParty.numItems(item);
        $gameParty.gainItem(item, val - cur);
      }

      /* ========= Actors ========= */
      function buildActorEditor(container){
        if (!window.$gameActors || !$gameParty) { container.textContent='Game not loaded yet.'; return; }
        $gameParty.members().forEach(actor=>{
          const id = actor.actorId();
          const block = document.createElement('div');
          block.innerHTML =
            `<b>${actor.name()}</b><br>
             <label>HP:</label><input type="number" id="hp-${id}" value="${actor.hp}">
             <button onclick="setActorHP(${id})">Set</button><br>
             <label>MP:</label><input type="number" id="mp-${id}" value="${actor.mp}">
             <button onclick="setActorMP(${id})">Set</button><br>
             <label>Level:</label><input type="number" id="lv-${id}" value="${actor.level}">
             <button onclick="setActorLV(${id})">Set</button>
             <hr>`;
          container.appendChild(block);
        });
      }
      function setActorHP(id){ const a=$gameActors.actor(id); const v=parseInt(document.getElementById('hp-'+id).value,10); if(!isNaN(v)) a.setHp(v); }
      function setActorMP(id){ const a=$gameActors.actor(id); const v=parseInt(document.getElementById('mp-'+id).value,10); if(!isNaN(v)) a.setMp(v); }
      function setActorLV(id){ const a=$gameActors.actor(id); const v=parseInt(document.getElementById('lv-'+id).value,10); if(!isNaN(v)) a.changeLevel(v,false); }

      /* ========= Vars & Switches ========= */
      function buildVarEditor(container){
        if(!window.$gameVariables||!window.$gameSwitches){ container.textContent='Game not loaded yet.'; return; }
        const varsTitle=document.createElement('h3'); varsTitle.textContent='Variables'; container.appendChild(varsTitle);
        // prefer showing variable names if available
        const maxVars = (window.$dataSystem && $dataSystem.variables) ? $dataSystem.variables.length-1 : 50;
        for(let i=1;i<=Math.min(maxVars,50);i++){
          const label = (window.$dataSystem && $dataSystem.variables[i]) ? $dataSystem.variables[i] : `Var ${i}`;
          const row = document.createElement('div'); row.className='row';
          row.innerHTML=`<label style="width:180px">${label}</label>
            <input type="number" id="var-${i}" value="${$gameVariables.value(i)}">
            <button onclick="setVar(${i})">Set</button>`;
          container.appendChild(row);
        }
        const swTitle=document.createElement('h3'); swTitle.textContent='Switches'; container.appendChild(swTitle);
        const maxSw = (window.$dataSystem && $dataSystem.switches) ? $dataSystem.switches.length-1 : 32;
        for(let i=1;i<=Math.min(maxSw,50);i++){
          const label = (window.$dataSystem && $dataSystem.switches[i]) ? $dataSystem.switches[i] : `Switch ${i}`;
          const row = document.createElement('div'); row.className='row';
          row.innerHTML=`<label style="width:180px">${label}</label>
            <input type="checkbox" id="sw-${i}" ${$gameSwitches.value(i)?'checked':''} onchange="setSwitch(${i})">`;
          container.appendChild(row);
        }
      }
      function setVar(i){ const v=parseInt(document.getElementById('var-'+i).value,10); if(!isNaN(v)) $gameVariables.setValue(i,v); }
      function setSwitch(i){ const v=document.getElementById('sw-'+i).checked; $gameSwitches.setValue(i,v); }

      /* ========= Time: robust detection & UI ========= */
      function buildTimeEditor(container){
        container.innerHTML = '<div class="small">The tool scans both $gameSystem properties and game variables. Use Auto-detect or pick a source manually, then Apply Time.</div>';
        const list = detectTimeCandidates();
        // create selectors & inputs
        const html = `
          <div class="row"><label style="width:120px">Hour source</label><select id="cheat-hour-source"></select></div>
          <div class="row"><label style="width:120px">Hour value</label><input type="number" id="cheat-hour-value" min="0" max="99"></div>
          <div class="row"><label style="width:120px">Minute source</label><select id="cheat-minute-source"></select></div>
          <div class="row"><label style="width:120px">Minute value</label><input type="number" id="cheat-minute-value" min="0" max="599"></div>
          <div class="row"><label style="width:120px">Day source</label><select id="cheat-day-source"></select></div>
          <div class="row"><label style="width:120px">Day value</label><input type="number" id="cheat-day-value" min="0"></div>
          <div class="row"><button onclick="setGameTime()">Apply Time</button><button onclick="autoDetectTime()">Auto-detect</button></div>
          <hr>
          <div class="small" id="time-candidates-info"></div>
        `;
        container.insertAdjacentHTML('beforeend', html);

        const hourSel = document.getElementById('cheat-hour-source');
        const minuteSel = document.getElementById('cheat-minute-source');
        const daySel = document.getElementById('cheat-day-source');

        // helper to render candidate
        function addOption(sel, c){
          const opt = document.createElement('option');
          const label = (c.source==='system') ? `system.${c.key} (${c.value})` : `Var ${c.id}: ${c.key||''} (${c.value})`;
          opt.text = label;
          opt.value = label; // human readable
          opt.dataset.source = c.source;
          if (c.source === 'system') opt.dataset.key = c.key;
          if (c.source === 'variable') opt.dataset.id = c.id;
          opt.dataset.value = String(c.value);
          opt.dataset.score = String(c.score||0);
          sel.appendChild(opt);
        }

        // add a "none" option
        [hourSel, minuteSel, daySel].forEach(s => {
          const n = document.createElement('option'); n.text = '-- none --'; n.value=''; s.appendChild(n);
        });

        // populate
        list.forEach(c => {
          addOption(hourSel, c);
          addOption(minuteSel, c);
          addOption(daySel, c);
        });

        // wire up change to update numeric input when selecting a candidate
        hourSel.addEventListener('change', ()=>{
          const sel = hourSel.selectedOptions[0];
          if(sel && sel.dataset.value) document.getElementById('cheat-hour-value').value = sel.dataset.value;
        });
        minuteSel.addEventListener('change', ()=>{
          const sel = minuteSel.selectedOptions[0];
          if(sel && sel.dataset.value) document.getElementById('cheat-minute-value').value = sel.dataset.value;
        });
        daySel.addEventListener('change', ()=>{
          const sel = daySel.selectedOptions[0];
          if(sel && sel.dataset.value) document.getElementById('cheat-day-value').value = sel.dataset.value;
        });

        // fill info panel
        const info = document.getElementById('time-candidates-info');
        if(list.length===0) info.textContent = 'No numeric candidates detected in $gameSystem or variables.';
        else {
          info.textContent = `Detected ${list.length} numeric candidate(s). Try Auto-detect first.`;
        }

        // run auto-detect initial
        setTimeout(autoDetectTime, 40);
      }

      // detect numeric properties and variables that might be time-related
      function detectTimeCandidates(){
        const candidates = [];
        // scoring helper
        function scoreName(n){
          if(!n) return 0;
          const s = n.toString().toLowerCase();
          let score = 0;
          if (s.includes('hour') || s.includes('hr') || s.match(/\bh\b/)) score += 20;
          if (s.includes('minute') || s.includes('min') || s.match(/\bm\b/)) score += 20;
          if (s.includes('time') || s.includes('clock')) score += 12;
          if (s.includes('day') || s.includes('date')) score += 8;
          if (s.includes('hourly')||s.includes('minute_')) score += 5;
          return score;
        }

        try {
          if (window.$gameSystem) {
            Object.keys($gameSystem).forEach(k=>{
              try {
                const v = $gameSystem[k];
                if (typeof v === 'number' && isFinite(v)) {
                  candidates.push({source:'system', key:k, value:v, score: scoreName(k)});
                }
              } catch(e){}
            });
          }
        } catch(e){}

        try {
          if (window.$gameVariables && window.$dataSystem && $dataSystem.variables) {
            const len = $dataSystem.variables.length;
            for (let i=1;i<len;i++){
              try {
                const name = $dataSystem.variables[i] || '';
                const value = $gameVariables.value(i);
                if (typeof value === 'number' && isFinite(value)) {
                  candidates.push({source:'variable', id:i, key:name, value:value, score: scoreName(name)});
                }
              } catch(e){}
            }
          } else if (window.$gameVariables) {
            // fallback: scan first 200 vars
            for (let i=1;i<=200;i++){
              try {
                const value = $gameVariables.value(i);
                if (typeof value === 'number' && isFinite(value)) {
                  candidates.push({source:'variable', id:i, key:`Var ${i}`, value:value, score:0});
                }
              } catch(e){}
            }
          }
        } catch(e){}

        // remove duplicates (same source/key)
        const unique = [];
        const seen = new Set();
        candidates.forEach(c=>{
          const id = (c.source==='system') ? `sys:${c.key}` : `var:${c.id}`;
          if (!seen.has(id)) { seen.add(id); unique.push(c); }
        });

        // add range hints
        unique.forEach(c=>{
          c.isHourPlausible = (c.value >= 0 && c.value <= 23);
          c.isMinutePlausible = (c.value >= 0 && c.value <= 59);
        });

        return unique;
      }

      // auto-detect best candidates and set selectors/values
      function autoDetectTime(){
        const list = detectTimeCandidates();
        // scoring function: name score + plausibility bonus
        function pick(pred){
          if(!list.length) return null;
          let best = null; let bestScore=-Infinity;
          list.forEach(c=>{
            let s = (c.score||0);
            if (pred === 'hour') {
              if (c.isHourPlausible) s += 30;
            } else if (pred === 'minute') {
              if (c.isMinutePlausible) s += 30;
            } else if (pred === 'day') {
              if (c.value >= 1 && c.value <= 9999) s += 10;
            }
            // slight preference for system props with strong names
            if (c.source === 'system') s += 3;
            if (s > bestScore) { bestScore = s; best = c; }
          });
          return best;
        }

        const h = pick('hour');
        const m = pick('minute');
        const d = pick('day');

        // fill selects if present
        const hourSel = document.getElementById('cheat-hour-source');
        const minuteSel = document.getElementById('cheat-minute-source');
        const daySel = document.getElementById('cheat-day-source');
        const hourVal = document.getElementById('cheat-hour-value');
        const minuteVal = document.getElementById('cheat-minute-value');
        const dayVal = document.getElementById('cheat-day-value');

        // helper to find option matching candidate
        function selectCandidate(sel, candidate){
          if(!sel || !candidate) return false;
          for(let i=0;i<sel.options.length;i++){
            const opt = sel.options[i];
            if (candidate.source === 'system' && opt.dataset.source === 'system' && opt.dataset.key === candidate.key) { sel.selectedIndex = i; return true; }
            if (candidate.source === 'variable' && opt.dataset.source === 'variable' && Number(opt.dataset.id) === candidate.id) { sel.selectedIndex = i; return true; }
          }
          return false;
        }

        if (hourSel && h) {
          selectCandidate(hourSel,h);
          if(hourVal) hourVal.value = h.value;
        }
        if (minuteSel && m) {
          selectCandidate(minuteSel,m);
          if(minuteVal) minuteVal.value = m.value;
        }
        if (daySel && d) {
          selectCandidate(daySel,d);
          if(dayVal) dayVal.value = d.value;
        }

        // if nothing selected, leave inputs empty for manual entry
      }

      // apply chosen time: writes to system property or variable depending on selected option
      function setGameTime(){
        try {
          const hourSel = document.getElementById('cheat-hour-source');
          const minuteSel = document.getElementById('cheat-minute-source');
          const daySel = document.getElementById('cheat-day-source');
          const hourVal = parseInt(document.getElementById('cheat-hour-value').value,10);
          const minuteVal = parseInt(document.getElementById('cheat-minute-value').value,10);
          const dayVal = parseInt(document.getElementById('cheat-day-value').value,10);

          function applyToSource(sel, v){
            if(!sel || !sel.selectedOptions || sel.selectedIndex <= 0) return false;
            const opt = sel.selectedOptions[0];
            const src = opt.dataset.source;
            if (src === 'system') {
              const key = opt.dataset.key;
              if (key && window.$gameSystem) {
                // set system property directly (plugins may respond)
                $gameSystem[key] = v;
                return true;
              }
            } else if (src === 'variable') {
              const id = Number(opt.dataset.id);
              if (!isNaN(id) && window.$gameVariables) {
                $gameVariables.setValue(id, v);
                return true;
              }
            }
            return false;
          }

          // apply
          if (!isNaN(hourVal)) applyToSource(hourSel, hourVal);
          if (!isNaN(minuteVal)) applyToSource(minuteSel, minuteVal);
          if (!isNaN(dayVal)) applyToSource(daySel, dayVal);

          // best-effort: if game exposes $gameSystem.setTime or similar, call it
          if (window.$gameSystem && typeof $gameSystem.setTime === 'function') {
            try { $gameSystem.setTime(hourVal, minuteVal, dayVal); } catch(e) {}
          }

          // feedback
          alert('Time applied. If the game does not immediately update, try using Refresh/scene interactions or set the correct source manually from the dropdown.');
        } catch (e) {
          console.error('setGameTime error', e);
          alert('Failed to apply time (see console).');
        }
      }

      /* ========= Settings (autosave, open save/load) ========= */
      let autosaveTimer = null;
      let autosaveSlot = 1; // default slot for autosave
      function buildSettingsEditor(container){
        container.innerHTML = `
          <div class="row"><label style="width:120px">Auto-save (min)</label><input type="number" id="autosaveInterval" value="0" min="0"><button onclick="applyAutosave()">Apply</button></div>
          <div class="row"><label style="width:120px">Slot</label><input type="number" id="autosaveSlot" value="${autosaveSlot}" min="1"><span class="small">Auto-save is OFF by default.</span></div>
          <div class="row"><button onclick="forceSaveNow()">Save Now (slot)</button><button onclick="forceLoadNow()">Load Now (slot)</button></div>
        `;
      }
      function applyAutosave(){
        const minutes = parseInt(document.getElementById('autosaveInterval').value,10);
        autosaveSlot = parseInt(document.getElementById('autosaveSlot').value,10) || 1;
        if (autosaveTimer) { clearInterval(autosaveTimer); autosaveTimer = null; }
        if (!isNaN(minutes) && minutes > 0) {
          autosaveTimer = setInterval(()=>{
            try {
              if (window.DataManager && typeof DataManager.saveGame === 'function') {
                DataManager.saveGame(autosaveSlot);
                console.log('Auto-saved slot', autosaveSlot);
              }
            } catch(e){ console.warn('autosave failed', e); }
          }, minutes * 60 * 1000);
          alert('Auto-save enabled: every ' + minutes + ' minute(s).');
        } else {
          alert('Auto-save disabled.');
        }
      }
      function forceSaveNow(){
        const slot = parseInt(document.getElementById('autosaveSlot').value,10) || 1;
        try {
          if (window.DataManager && typeof DataManager.saveGame === 'function') {
            DataManager.saveGame(slot);
            alert('Save requested to slot '+slot+'.');
          } else {
            alert('Save function not available in this game context.');
          }
        } catch(e){
          console.warn(e); alert('Save failed (see console).');
        }
      }
      function forceLoadNow(){
        const slot = parseInt(document.getElementById('autosaveSlot').value,10) || 1;
        try {
          if (window.DataManager && typeof DataManager.loadGame === 'function') {
            // If DataManager.loadGame returns a Promise / state, many MV projects use Scene_Load instead.
            DataManager.loadGame(slot)
              .then((ok) => { alert('Load requested.'); })
              .catch((err) => { console.warn(err); alert('Load failed (see console).'); });
          } else if (window.SceneManager && typeof SceneManager.push === 'function' && window.Scene_Load) {
            // open the load scene so the player can pick slot or load manually
            SceneManager.push(Scene_Load);
          } else {
            alert('No load API available; opening Load scene if possible.');
            if (window.SceneManager && window.Scene_Load) SceneManager.push(Scene_Load);
          }
        } catch(e){
          console.warn(e); alert('Load failed (see console).');
        }
      }

      /* ========= ESC button (pointer + debounce) ========= */
      (function(){
        const btn = document.getElementById('escButton');
        let pressed = false;
        function sendEsc(){
          if (pressed) return;
          pressed = true;
          try {
            // first try direct SceneManager action (map -> open menu)
            if (window.SceneManager && SceneManager._scene) {
              const sc = SceneManager._scene;
              if (window.Scene_Map && sc instanceof Scene_Map) {
                // map scene: emulate cancel/back -> Scene_Menu
                if (window.$gamePlayer && $gamePlayer.canMove && $gamePlayer.canMove()) {
                  if (window.SoundManager && SoundManager.playOk) try { SoundManager.playOk(); } catch(e){}
                  if (window.Window_MenuCommand && Window_MenuCommand.initCommandPosition) {
                    try { Window_MenuCommand.initCommandPosition(); } catch(e) {}
                  }
                  try { SceneManager.push(Scene_Menu); } catch(e){}
                  // release after small delay
                  setTimeout(()=>{ pressed=false; }, 250);
                  return;
                }
              }
            }
            // fallback: dispatch a keydown/keyup pair for Escape
            const evDown = new KeyboardEvent('keydown', {key:'Escape', code:'Escape', bubbles:true, cancelable:true});
            try { Object.defineProperty(evDown, 'keyCode', {get: ()=>27}); } catch(e){}
            document.dispatchEvent(evDown);
            setTimeout(()=>{
              const evUp = new KeyboardEvent('keyup', {key:'Escape', code:'Escape', bubbles:true, cancelable:true});
              try { Object.defineProperty(evUp, 'keyCode', {get: ()=>27}); } catch(e){}
              document.dispatchEvent(evUp);
              pressed=false;
            }, 40);
          } catch(e) { pressed=false; console.warn(e); }
        }
        // use pointerdown to cover mouse/touch/stylus but avoid double events
        btn.addEventListener('pointerdown', (ev)=>{ ev.preventDefault(); sendEsc(); }, {passive:false});
        // also allow keyboard Esc to function normally
        document.addEventListener('keydown', (ev)=>{ if(ev.key === 'Escape') sendEsc(); });
      })();
    </script>
  </body>
</html>
