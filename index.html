<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- modern PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- keep the old Apple ones for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>
    <style>
      /* ===== Cheat sidebar ===== */
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -360px;
        width: 360px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 99998;
        padding: 12px 12px 20px 12px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #cheatTabs { margin-bottom:10px; }
      #cheatTabs button {
        margin-right: 6px;
        margin-bottom: 6px;
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #cheatPanel label { display:inline-block; width:150px; }
      #cheatPanel input { width:70px; margin-right:6px; }
      #cheatPanel .row { margin: 6px 0; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }

      /* Floating open button */
      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100000;
        cursor: pointer;
        user-select: none;
      }

      /* Virtual ESC button */
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100000;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }

      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; }
    </style>
  </head>
  <body style="background-color: black">
    <!-- RPG Maker MV core -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button onclick="showCheatTab('money')">Money</button>
        <button onclick="showCheatTab('items')">Items</button>
        <button onclick="showCheatTab('actors')">Actors</button>
        <button onclick="showCheatTab('vars')">Vars</button>
        <button onclick="showCheatTab('time')">Time</button>
        <button onclick="showCheatTab('save')">Save</button>
      </div>
      <div id="cheatContent">Choose a tab…</div>
    </div>

    <!-- Virtual ESC button -->
    <button id="escButton">ESC</button>

    <script>
      /* Panel open/close */
      (function(){
        const fab   = document.getElementById('cheatFab');
        const panel = document.getElementById('cheatPanel');
        const close = document.getElementById('cheatClose');
        function openPanel(){ panel.classList.add('open'); fab.style.display='none'; }
        function closePanel(){ panel.classList.remove('open'); fab.style.display='block'; }
        fab.addEventListener('click', openPanel);
        close.addEventListener('click', closePanel);
      })();

      /* Cheat tabs */
      function showCheatTab(tab){
        const box=document.getElementById('cheatContent'); box.innerHTML='';
        try{
          if(tab==='money') return buildMoneyEditor(box);
          if(tab==='items') return buildItemEditor(box);
          if(tab==='actors')return buildActorEditor(box);
          if(tab==='vars')  return buildVarEditor(box);
          if(tab==='time')  return buildTimeEditor(box);
          if(tab==='save')  return buildSaveEditor(box);
        }catch(e){ box.textContent='Game not loaded yet.'; }
      }

      /* Money */
      function buildMoneyEditor(c){
        if(!window.$gameParty){c.textContent='Game not loaded.';return;}
        const g=$gameParty.gold();
        c.innerHTML=`<label>Money</label><input type="number" id="cheat-money" value="${g}">
                     <button onclick="setMoney()">Set</button>`;
      }
      function setMoney(){
        const v=parseInt(document.getElementById('cheat-money').value,10);
        if(!isNaN(v)) $gameParty._gold=v;
      }

      /* Items */
      function buildItemEditor(c){
        if(!$dataItems||!$gameParty){c.textContent='Game not loaded.';return;}
        $dataItems.forEach(it=>{
          if(it){
            const row=document.createElement('div');
            row.innerHTML=`<label>${it.name}</label>
              <input type="number" id="cheat-item-${it.id}" value="${$gameParty.numItems(it)}">
              <button onclick="setItem(${it.id})">Set</button>`;
            c.appendChild(row);
          }
        });
      }
      function setItem(id){
        const v=parseInt(document.getElementById('cheat-item-'+id).value,10);
        if(isNaN(v))return;
        const it=$dataItems[id], cur=$gameParty.numItems(it);
        $gameParty.gainItem(it,v-cur);
      }

      /* Actors */
      function buildActorEditor(c){
        if(!$gameActors||!$gameParty){c.textContent='Game not loaded.';return;}
        $gameParty.members().forEach(a=>{
          const id=a.actorId(),b=document.createElement('div');
          b.innerHTML=`<b>${a.name()}</b><br>
            <label>HP:</label><input type="number" id="hp-${id}" value="${a.hp}">
            <button onclick="setActorHP(${id})">Set</button><br>
            <label>MP:</label><input type="number" id="mp-${id}" value="${a.mp}">
            <button onclick="setActorMP(${id})">Set</button><br>
            <label>Level:</label><input type="number" id="lv-${id}" value="${a.level}">
            <button onclick="setActorLV(${id})">Set</button><hr>`;
          c.appendChild(b);
        });
      }
      function setActorHP(id){const a=$gameActors.actor(id);const v=parseInt(document.getElementById('hp-'+id).value,10);if(!isNaN(v))a.setHp(v);}
      function setActorMP(id){const a=$gameActors.actor(id);const v=parseInt(document.getElementById('mp-'+id).value,10);if(!isNaN(v))a.setMp(v);}
      function setActorLV(id){const a=$gameActors.actor(id);const v=parseInt(document.getElementById('lv-'+id).value,10);if(!isNaN(v))a.changeLevel(v,false);}

      /* Vars */
      function buildVarEditor(c){
        if(!$gameVariables||!$gameSwitches){c.textContent='Game not loaded.';return;}
        for(let i=1;i<=10;i++){
          const r=document.createElement('div');
          r.innerHTML=`<label>Var ${i}</label><input type="number" id="var-${i}" value="${$gameVariables.value(i)}">
            <button onclick="setVar(${i})">Set</button>`;
          c.appendChild(r);
        }
        for(let i=1;i<=10;i++){
          const r=document.createElement('div');
          r.innerHTML=`<label>Switch ${i}</label><input type="checkbox" id="sw-${i}" ${$gameSwitches.value(i)?'checked':''} onchange="setSwitch(${i})">`;
          c.appendChild(r);
        }
      }
      function setVar(i){const v=parseInt(document.getElementById('var-'+i).value,10);if(!isNaN(v))$gameVariables.setValue(i,v);}
      function setSwitch(i){$gameSwitches.setValue(i,document.getElementById('sw-'+i).checked);}

      /* Time */
      function buildTimeEditor(c){
        if(!$gameVariables){c.textContent='Game not loaded.';return;}
        let hourId=null, minId=null;
        for(let i=1;i<=200;i++){const v=$gameVariables.value(i);if(v>=0&&v<=24){hourId=i;}if(v>=0&&v<=60){minId=i;}}
        if(!hourId||!minId){c.textContent='Time vars not auto-detected.';return;}
        c.innerHTML=`<label>Hour</label><input type="number" id="time-hour" value="${$gameVariables.value(hourId)}">
                     <button onclick="setHour(${hourId})">Set</button><br>
                     <label>Minute</label><input type="number" id="time-min" value="${$gameVariables.value(minId)}">
                     <button onclick="setMinute(${minId})">Set</button>`;
      }
      function setHour(id){const v=parseInt(document.getElementById('time-hour').value,10);if(!isNaN(v))$gameVariables.setValue(id,v);}
      function setMinute(id){const v=parseInt(document.getElementById('time-min').value,10);if(!isNaN(v))$gameVariables.setValue(id,v);}

      /* Save */
      let autoSaveTimer=null;
      function buildSaveEditor(c){
        c.innerHTML=`<label>Auto-save:</label><input type="checkbox" id="autoSaveToggle"><br>
          <label>Interval</label>
          <select id="autoSaveInterval">
            <option value="5">5 min</option><option value="10">10 min</option>
            <option value="15">15 min</option><option value="20">20 min</option>
          </select><br>
          <button onclick="forceSave()">Save Now</button>
          <button onclick="forceLoad()">Load Now</button>`;
        document.getElementById('autoSaveToggle').addEventListener('change',function(){
          if(this.checked){startAutoSave();}else{stopAutoSave();}
        });
      }
      function startAutoSave(){
        stopAutoSave();
        const mins=parseInt(document.getElementById('autoSaveInterval').value,10);
        autoSaveTimer=setInterval(forceSave,mins*60000);
      }
      function stopAutoSave(){if(autoSaveTimer){clearInterval(autoSaveTimer);autoSaveTimer=null;}}
      function forceSave(){try{if(DataManager.saveGame)$gameSystem.onBeforeSave();DataManager.saveGame(1);}catch(e){}}
      function forceLoad(){try{if(DataManager.loadGame)DataManager.loadGame(1).then(()=>Scene_Load.prototype.reloadMapIfUpdated());}catch(e){}}

      /* ESC button (true cancel/back) */
      (function(){
        const btn=document.getElementById('escButton');
        function sendEsc(){
          try{
            const ev=new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true});
            Object.defineProperty(ev,'keyCode',{get:()=>27});
            document.dispatchEvent(ev);
          }catch(e){}
        }
        btn.addEventListener('click',sendEsc);
        btn.addEventListener('touchstart',sendEsc);
      })();
    </script>
  </body>
</html>
