<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- modern PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- keep the old Apple ones for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="user-scalable=no">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon/icon.png">
    <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
    <title>冬日狂想曲 v1.02</title>
    <style>
      /* ===== Cheat sidebar ===== */
      #cheatPanel {
        position: fixed;
        top: 0;
        right: -360px;        /* hidden */
        width: 360px;
        height: 100%;
        background: rgba(17,17,17,.98);
        color: #fff;
        overflow-y: auto;
        z-index: 99998;
        padding: 12px 12px 20px 12px;
        box-sizing: border-box;
        transition: right .28s ease;
        font-family: Arial, sans-serif;
        font-size: 14px;
        -webkit-overflow-scrolling: touch;
      }
      #cheatPanel.open { right: 0; }
      #cheatPanel h2 {
        margin: 8px 0 10px;
        font-size: 16px;
        border-bottom: 1px solid #444;
        padding-bottom: 6px;
      }
      #cheatClose {
        position: sticky;
        top: 0;
        display: inline-block;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      #cheatTabs { margin-bottom:10px; }
      #cheatTabs button {
        margin-right: 6px;
        margin-bottom: 6px;
        background: #2a2a2a;
        border: 1px solid #555;
        color: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #cheatPanel label { display:inline-block; width:150px; }
      #cheatPanel input { width:70px; margin-right:6px; }
      #cheatPanel .row { margin: 6px 0; }
      #cheatPanel hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }

      /* Floating open button that’s visible when the panel is closed */
      #cheatFab {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        border-radius: 22px;
        background: rgba(34,34,34,.95);
        color: #fff;
        border: 1px solid #555;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
        z-index: 100000;
        cursor: pointer;
        user-select: none;
      }

      /* ===== Virtual ESC button (fixed at left corner) ===== */
      #escButton {
        position: fixed;
        left: 12px;
        bottom: 12px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(68,68,68,0.95);
        color: #fff;
        border: 1px solid #555;
        font-size: 16px;
        font-weight: bold;
        z-index: 100000;
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
      }

      /* Make sure overlays never block pointer events to the game except on their own surface */
      #cheatPanel, #cheatFab, #escButton { pointer-events: auto; }
      canvas, body { touch-action: manipulation; }
    </style>
  </head>
  <body style="background-color: black">
    <!-- RPG Maker MV core files -->
    <script src="js/libs/pixi.js"></script>
    <script src="js/libs/pixi-tilemap.js"></script>
    <script src="js/libs/pixi-picture.js"></script>
    <script src="js/libs/fpsmeter.js"></script>
    <script src="js/libs/lz-string.js"></script>
    <script src="js/libs/iphone-inline-video.browser.js"></script>
    <script src="js/rpg_core.js"></script>
    <script src="js/rpg_managers.js"></script>
    <script src="js/rpg_objects.js"></script>
    <script src="js/rpg_scenes.js"></script>
    <script src="js/rpg_sprites.js"></script>
    <script src="js/rpg_windows.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Floating open button -->
    <div id="cheatFab" title="Open cheats">≡</div>

    <!-- Cheat panel -->
    <div id="cheatPanel" aria-hidden="true">
      <button id="cheatClose">Close</button>
      <h2>Cheat Menu</h2>
      <div id="cheatTabs">
        <button type="button" onclick="showCheatTab('money')">Money</button>
        <button type="button" onclick="showCheatTab('items')">Items</button>
        <button type="button" onclick="showCheatTab('actors')">Actors</button>
        <button type="button" onclick="showCheatTab('vars')">Vars</button>
      </div>
      <div id="cheatContent">Choose a tab…</div>
    </div>

    <!-- Virtual ESC (opens menu reliably on mobile) -->
    <button id="escButton" type="button" title="Open menu (ESC)">ESC</button>

    <script>
      /* ========= Panel open/close ========= */
      (function(){
        const fab   = document.getElementById('cheatFab');
        const panel = document.getElementById('cheatPanel');
        const close = document.getElementById('cheatClose');

        function openPanel(){
          panel.classList.add('open');
          panel.setAttribute('aria-hidden','false');
          fab.style.display = 'none';
        }
        function closePanel(){
          panel.classList.remove('open');
          panel.setAttribute('aria-hidden','true');
          fab.style.display = 'block';
        }
        fab.addEventListener('click', openPanel);
        close.addEventListener('click', closePanel);

        // Expose for console tests
        window.__cheatPanelOpen = openPanel;
        window.__cheatPanelClose = closePanel;
      })();

      /* ========= Cheat tabs ========= */
      function showCheatTab(tab){
        const box = document.getElementById('cheatContent');
        box.innerHTML = '';
        try {
          if (tab === 'money') return buildMoneyEditor(box);
          if (tab === 'items')  return buildItemEditor(box);
          if (tab === 'actors') return buildActorEditor(box);
          if (tab === 'vars')   return buildVarEditor(box);
        } catch (e) {
          box.textContent = 'Game not fully loaded yet.';
        }
      }

      /* ========= Money ========= */
      function buildMoneyEditor(container){
        if (!window.$gameParty) {
          container.textContent = 'Game not loaded yet.';
          return;
        }
        const gold = $gameParty.gold ? $gameParty.gold() : 0;
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML =
          `<label>Money</label>
           <input type="number" id="cheat-money" value="${gold}" min="0">
           <button type="button" onclick="setMoney()">Set</button>`;
        container.appendChild(row);
      }
      function setMoney(){
        const input = document.getElementById('cheat-money');
        if (!input) return;
        const val = parseInt(input.value, 10);
        if (!isNaN(val) && window.$gameParty) {
          $gameParty._gold = val;
        }
      }

      /* ========= Items ========= */
      function buildItemEditor(container){
        if (!window.$dataItems || !window.$gameParty) {
          container.textContent = 'Game not loaded yet.';
          return;
        }
        window.$dataItems.forEach(item=>{
          if (item) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML =
              `<label>${item.name}</label>
               <input type="number" id="cheat-item-${item.id}" value="${$gameParty.numItems(item)}" min="0">
               <button type="button" onclick="setItem(${item.id})">Set</button>`;
            container.appendChild(row);
          }
        });
      }
      function setItem(id){
        const input = document.getElementById('cheat-item-'+id);
        if (!input) return;
        const val = parseInt(input.value, 10);
        if (isNaN(val)) return;
        const item = $dataItems[id];
        const cur = $gameParty.numItems(item);
        $gameParty.gainItem(item, val - cur);
      }

      /* ========= Actors ========= */
      function buildActorEditor(container){
        if (!window.$gameActors || !$gameParty) {
          container.textContent = 'Game not loaded yet.';
          return;
        }
        $gameParty.members().forEach(actor=>{
          const id = actor.actorId();
          const block = document.createElement('div');
          block.innerHTML =
            `<b>${actor.name()}</b><br>
             <label>HP:</label><input type="number" id="hp-${id}" value="${actor.hp}">
             <button type="button" onclick="setActorHP(${id})">Set</button><br>
             <label>MP:</label><input type="number" id="mp-${id}" value="${actor.mp}">
             <button type="button" onclick="setActorMP(${id})">Set</button><br>
             <label>Level:</label><input type="number" id="lv-${id}" value="${actor.level}">
             <button type="button" onclick="setActorLV(${id})">Set</button>
             <hr>`;
          container.appendChild(block);
        });
      }
      function setActorHP(id){
        const a = $gameActors.actor(id);
        const v = parseInt(document.getElementById('hp-'+id).value,10);
        if (!isNaN(v)) a.setHp(v);
      }
      function setActorMP(id){
        const a = $gameActors.actor(id);
        const v = parseInt(document.getElementById('mp-'+id).value,10);
        if (!isNaN(v)) a.setMp(v);
      }
      function setActorLV(id){
        const a = $gameActors.actor(id);
        const v = parseInt(document.getElementById('lv-'+id).value,10);
        if (!isNaN(v)) a.changeLevel(v,false);
      }

      /* ========= Variables & Switches ========= */
      function buildVarEditor(container){
        if (!window.$gameVariables || !window.$gameSwitches) {
          container.textContent = 'Game not loaded yet.';
          return;
        }
        const varsTitle = document.createElement('h3');
        varsTitle.textContent = 'Variables';
        container.appendChild(varsTitle);
        for (let i=1;i<=10;i++){
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML =
            `<label>Var ${i}</label>
             <input type="number" id="var-${i}" value="${$gameVariables.value(i)}">
             <button type="button" onclick="setVar(${i})">Set</button>`;
          container.appendChild(row);
        }
        const swTitle = document.createElement('h3');
        swTitle.textContent = 'Switches';
        container.appendChild(swTitle);
        for (let i=1;i<=10;i++){
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML =
            `<label>Switch ${i}</label>
             <input type="checkbox" id="sw-${i}" ${$gameSwitches.value(i)?'checked':''}
               onchange="setSwitch(${i})">`;
          container.appendChild(row);
        }
      }
      function setVar(i){
        const v = parseInt(document.getElementById('var-'+i).value,10);
        if (!isNaN(v)) $gameVariables.setValue(i,v);
      }
      function setSwitch(i){
        const v = document.getElementById('sw-'+i).checked;
        $gameSwitches.setValue(i,v);
      }

      /* ========= Virtual ESC ========= */
      (function(){
        const btn = document.getElementById('escButton');
        function openMenuDirect(){
          try {
            if (window.SceneManager && SceneManager._scene) {
              const sc = SceneManager._scene;
              if (window.Scene_Map && sc instanceof Scene_Map) {
                if (window.$gamePlayer && $gamePlayer.canMove()) {
                  if (window.SoundManager && SoundManager.playOk) SoundManager.playOk();
                  if (window.Window_MenuCommand && Window_MenuCommand.initCommandPosition) {
                    Window_MenuCommand.initCommandPosition();
                  }
                  SceneManager.push(Scene_Menu);
                  return true;
                }
              }
            }
          } catch(e) {}
          return false;
        }
        function onEscPress(e){
          e && e.preventDefault();
          if (!openMenuDirect()) {
            try {
              const ev = new KeyboardEvent('keydown', {key:'Escape', code:'Escape', bubbles:true, cancelable:true});
              Object.defineProperty(ev, 'keyCode', {get: ()=>27});
              Object.defineProperty(ev, 'which',   {get: ()=>27});
              document.dispatchEvent(ev);
              window.dispatchEvent(ev);
              setTimeout(()=>{
                const ev2 = new KeyboardEvent('keyup', {key:'Escape', code:'Escape', bubbles:true, cancelable:true});
                Object.defineProperty(ev2, 'keyCode', {get: ()=>27});
                Object.defineProperty(ev2, 'which',   {get: ()=>27});
                document.dispatchEvent(ev2);
                window.dispatchEvent(ev2);
              },16);
            } catch(_) {}
          }
        }
        btn.addEventListener('click', onEscPress, {passive:false});
        btn.addEventListener('touchstart', onEscPress, {passive:false});
      })();
    </script>
  </body>
</html>
